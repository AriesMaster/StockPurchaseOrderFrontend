name: Angular CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: ./package-lock.json
      - run: npm install --global npm@11.20.0
      - run: npm ci
      - run: npm run build
      - run: npm test -- --watch=false
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        with:
          name: angular-build
          path: ./dist/
          retention-days: 7
