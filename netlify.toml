[build]
  command = "npm run build"
  publish = "dist/stock-purchase-order-frontend/browser"

[build.environment]
  NODE_VERSION = "26.13.0"

[[redirects]]
  from = "/api/*"
  to = "https://stockflow-backend-5cke.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
